name: Build Android APK Natively

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g:i386 \
          libncurses5:i386 \
          libstdc++6:i386 \
          libreadline-dev \
          libsqlite3-dev \
          wget \
          curl \
          libssl-dev

    - name: Install Python Dependencies & Buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $HOME/.android
        sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: kareem-repair-v2
        path: bin/*.apk
